services:
  mongo:
    image: mongo:7
    container_name: cdd-mongo
    volumes:
      - cdd-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  cdd-viewer:
    build: .
    image: cdd-viewer:dev
    container_name: cdd-viewer
    # The workbook holds personal data: only expose the page on this computer.
    ports:
      - "127.0.0.1:${CDD_PORT:-8765}:8000"
    environment:
      CDD_DEFAULT_FILE: "CDD base dummy.xlsx"
      CDD_SHEET: "CDD"
      CDD_OUTDATED_FILLS: "00B0F0"
      CDD_MONGO_URL: mongodb://mongo:27017
      CDD_MONGO_DB: cdd
      CDD_LMSTUDIO_URL: http://host.docker.internal:1234/v1
    volumes:
      - "${CDD_EXCEL_DIR:-../Database purge}:/data:ro"
      - "./output:/app/output"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cdd-mongo:
