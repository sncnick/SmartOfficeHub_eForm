<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDD 公司資料檢視</title>
  <link rel="stylesheet" href="/static/style.css?v=20261103bo">
</head>
<body>
  <header class="topbar">
    <div class="brand">CDD 公司資料檢視</div>
    <div class="toolbar">
      <label class="control">匯入用 Excel
        <select id="fileSelect" aria-label="選擇要匯入的 Excel"></select>
      </label>
      <button type="button" class="btn" id="importFileBtn">匯入所選 Excel</button>
      <label class="btn">上載 Excel
        <input type="file" id="uploadInput" accept=".xlsx,.xlsm" hidden>
      </label>
      <button type="button" class="btn" id="downloadBtn">下載 JSON</button>
      <button type="button" class="btn" id="issuesBtn">資料問題 <span id="issueCount" class="count"></span></button>
      <button type="button" class="btn" id="openSettings">設定</button>
      <label class="control"><input type="checkbox" id="expandOutdated"> 展開所有 OUTDATED</label>
    </div>
  </header>
  <div class="source-bar" id="sourceBar"></div>

  <div class="layout excel-collapsed">
    <aside class="sidebar">
      <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-expanded="true" title="收起側欄">⟨</button>
      <input type="search" id="search" placeholder="搜尋編號、公司名、BR、人名…" autocomplete="off">
      <div class="filter-panel" id="filterPanel"></div>
      <div class="muted small" id="companyCount"></div>
      <ul class="company-list" id="companyList"></ul>
    </aside>
    <main class="main" id="main">
      <div class="placeholder">載入中…</div>
    </main>
    <aside class="excel-pane" id="excelPane">
      <div class="excel-resize" id="excelResize" role="separator" aria-orientation="vertical" aria-label="拉動調整 Excel 寬度" title="拉動調整寬度，雙按還原"></div>
      <button type="button" class="sidebar-toggle" id="excelToggle" aria-expanded="false" title="展開 Excel">Excel</button>
      <div class="excel-body" id="excelBody">
        <div class="excel-head">
          <h2>Excel</h2>
          <div class="excel-head-actions">
            <select id="mapProfilePick" class="excel-head-select" aria-label="已儲存的對應做法" title="叫回已儲存的對應做法">
              <option value="">叫回做法</option>
            </select>
            <button type="button" class="btn small" id="mapProfileLoad">叫回</button>
            <button type="button" class="btn small" id="excelLm">分析這一頁</button>
            <button type="button" class="btn small" id="excelPop" title="開新視窗">彈出視窗</button>
            <button type="button" class="btn small" id="excelForm" title="做成可列印表格">表格成品</button>
          </div>
        </div>
        <details class="excel-fold" id="excelPickFold">
          <summary>選表</summary>
          <div class="excel-fold-body">
            <div class="excel-pick-row">
              <label class="excel-pick">檔案
                <select id="excelFile" aria-label="要閱讀的檔案"></select>
              </label>
              <label class="excel-pick">工作表
                <select id="excelSheet" aria-label="工作表"></select>
              </label>
            </div>
            <div class="excel-fold-actions">
              <button type="button" class="btn" id="excelRead">讀取</button>
              <button type="button" class="btn" id="excelSplit" title="依列印範圍拆成獨立工作表，再合成一份表格檔">依列印範圍組成表格檔</button>
            </div>
            <div class="excel-fold-actions excel-map-save">
              <input id="mapProfileName" type="text" maxlength="40" placeholder="做法名稱" autocomplete="off" aria-label="對應做法名稱">
              <button type="button" class="btn" id="mapProfileSave">儲存</button>
              <button type="button" class="btn" id="mapProfileDelete" title="刪除已選的做法，不改畫面上的對應">刪除</button>
            </div>
          </div>
        </details>
        <div class="excel-meta-row" id="excelMetaRow">
          <div class="excel-page-nav">
            <button type="button" class="btn small" id="excelSheetPrev" disabled>上一頁</button>
            <button type="button" class="btn small" id="excelFormPageToggle" disabled title="標記這一頁納入表格 PDF">納入</button>
            <button type="button" class="btn small" id="excelSheetNext" disabled>下一頁</button>
          </div>
          <p class="muted small" id="excelMeta">選擇檔案後按讀取。儲存格寫 [[]] 後，該格會變成可搜尋的下拉選單。這不會改資料庫。</p>
        </div>
        <div class="excel-scroll" id="excelScroll"></div>
        <div class="excel-pager">
          <button type="button" class="btn small" id="excelPrev" disabled>上一段</button>
          <span id="excelPage"></span>
          <button type="button" class="btn small" id="excelNext" disabled>下一段</button>
        </div>
      </div>
    </aside>
  </div>

  <div class="overlay hidden" id="issuesOverlay">
    <div class="panel" role="dialog" aria-label="資料問題清單">
      <div class="panel-head">
        <h2>資料問題清單</h2>
        <div class="panel-tools">
          <select id="severityFilter" aria-label="程度">
            <option value="warning">錯誤及警告</option>
            <option value="all">全部（包括提示）</option>
            <option value="error">只看錯誤</option>
          </select>
          <input type="search" id="issueSearch" placeholder="搜尋說明或公司…" autocomplete="off">
          <button type="button" class="btn" id="closeIssues">關閉</button>
        </div>
      </div>
      <div class="panel-body" id="issuesBody"></div>
    </div>
  </div>

  <div class="overlay hidden" id="settingsOverlay">
    <div class="panel settings-panel" role="dialog" aria-labelledby="settingsTitle">
      <div class="panel-head">
        <h2 id="settingsTitle">系統設定</h2>
        <button type="button" class="btn" id="closeSettings">關閉</button>
      </div>
      <div class="panel-body">
        <section class="settings-block">
          <h3>LM Studio</h3>
          <div class="settings-fields">
            <label>位址
              <input id="excelLmUrl" type="url" value="http://127.0.0.1:1234/v1" spellcheck="false" aria-label="LM Studio 位址">
            </label>
            <label>模型
              <select id="excelLmModel" aria-label="LM Studio 模型"></select>
            </label>
            <div class="settings-actions">
              <button type="button" class="btn small" id="excelLmTest">測試連線</button>
            </div>
            <p class="muted small" id="excelLmStatus">尚未測試連線。</p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="pie-tip hidden" id="pieTip" role="tooltip"></div>
  <script src="/static/app.js?v=20261103bo"></script>
</body>
</html>
